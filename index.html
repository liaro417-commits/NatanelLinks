<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>עמוד הקישורים הרשמי</title>
<meta name="description" content="כל הקישורים, הרשתות החברתיות, לוח השידורים ומפרט הגיימינג במקום אחד.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg1:#020a1a; --bg2:#04152e; --card:#071a36; --card2:#0a2447;
  --line:#12507f; --line2:#1b7fb8; --cyan:#27c6ff; --text:#eaf6ff; --muted:#8db0cf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--text);font-family:Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;
  background:radial-gradient(ellipse 520px 440px at 0% 100%,rgba(8,42,90,.45) 0%,rgba(7,38,80,.34) 30%,rgba(5,30,62,.18) 60%,transparent 100%) fixed,
    radial-gradient(ellipse 420px 340px at 100% 100%,rgba(6,34,60,.35) 0%,rgba(5,28,50,.2) 50%,transparent 100%) fixed,
    radial-gradient(ellipse 1000px 1050px at 52% 11%,rgb(3,35,56) 0%,rgb(3,31,51) 30%,rgb(3,25,43) 45%,rgb(3,19,34) 60%,rgb(3,12,25) 80%,rgb(3,7,18) 100%) fixed #030712}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(40,170,230,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(40,170,230,.035) 1px,transparent 1px);
  background-size:48px 48px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:512px;margin:0 auto;padding:38px 16px 56px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}

.top{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;background:rgba(7,26,54,.8);border:1px solid var(--line);border-radius:10px}
.iconbtn:hover{border-color:var(--cyan)}
.badge{transform:translateX(20px);font-family:Orbitron,sans-serif;font-weight:600;font-size:10px;letter-spacing:.08em;color:var(--cyan);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(7,26,54,.8);direction:ltr}

.hero{text-align:center;margin-top:6px}
.logo{position:relative;width:136px;height:136px;margin:0 auto;border-radius:22px;border:2px solid var(--cyan);background:linear-gradient(150deg,#0d4f86,#06152c 70%);box-shadow:0 0 28px rgba(39,198,255,.45),inset 0 0 24px rgba(39,198,255,.25);display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:19px;display:block}
.verified svg{width:16px;height:16px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 28px rgba(39,198,255,.45),inset 0 0 24px rgba(39,198,255,.25)}50%{box-shadow:0 0 52px rgba(39,198,255,.9),inset 0 0 24px rgba(39,198,255,.25)}}
.logo{animation:float 3s ease-in-out infinite,glow 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
.verified{position:absolute;right:-10px;bottom:-10px;width:30px;height:30px;border-radius:50%;background:var(--cyan);display:grid;place-items:center;border:3px solid var(--bg2)}
.name{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0 0;direction:ltr}
.name .star{width:24px;height:24px;display:grid;place-items:center;border:1px solid #107b92;border-radius:6px;background:#034057}
.name .star svg{width:13px;height:13px;display:block}
h1{margin:0;text-transform:uppercase;font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(32px,10vw,46px);letter-spacing:.1em;background:linear-gradient(90deg,#fff 0%,#e6f6ff 30%,#4fd0ff 70%,#1f9bff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 0 12px rgba(39,198,255,.55))}
.sub{margin:6px 0 0;font-family:Orbitron,sans-serif;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--cyan);direction:ltr}

.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 24px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(7,26,54,.8);font-size:13px;font-weight:500}
.pill:hover{border-color:var(--cyan)}
.pill[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#021226}
.pill svg{width:15px;height:15px}

.cards{display:grid;gap:14px;margin-top:32px}
.card{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,var(--card2),var(--card));color:var(--text);text-decoration:none;box-shadow:0 0 14px rgba(39,198,255,.1);transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--cyan);box-shadow:0 0 22px rgba(39,198,255,.3)}
.tile{flex:none;width:54px;height:54px;border-radius:12px;display:grid;place-items:center;background:#050d1c;border:2px solid var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 28%,transparent);transition:transform .15s;overflow:hidden}
.tile svg{width:32px;height:32px;filter:drop-shadow(0 0 5px var(--c));display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .tile{transform:scale(1.08)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;font-weight:700}
.txt span{display:block;color:var(--muted);font-size:13px}
.txt b svg{width:15px;height:15px;vertical-align:-2px;margin-inline-end:6px;color:var(--cyan)}
.go{flex:none;width:32px;height:32px;display:grid;place-items:center;border:1.5px solid var(--cyan);border-radius:8px;color:#7fe3ff;background:rgba(39,198,255,.14);box-shadow:0 0 12px rgba(39,198,255,.45)}
.card.hide{display:none}

section{margin-top:36px}
h2{margin:0 0 12px;font-size:19px;font-weight:700}
.panel{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--card);margin:0;padding:0;list-style:none}
.panel>*{padding:13px 16px}
.panel>*+*{border-top:1px solid var(--line)}
.sched li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center}
.sched .day{font-weight:700}
.sched .game{color:var(--muted)}
.sched .time{direction:ltr;font-variant-numeric:tabular-nums}
.sched li.off{opacity:.5}
.sched li.today{background:rgba(39,198,255,.12);box-shadow:inset -3px 0 0 var(--cyan)}
.sched li.today .game{color:var(--text)}
.specs div{display:flex;justify-content:space-between;gap:16px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-weight:500;direction:ltr}
footer{margin-top:40px;text-align:center;color:var(--muted);font-size:13px}
footer div+div{margin-top:8px}
footer .hl{display:inline-block;color:#9fe4ff;font-family:Orbitron,sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;text-shadow:0 0 6px var(--cyan),0 0 16px var(--cyan)}
</style>
</head>

/* חלקיקים זוהרים */
(function(){
  const c = $("fx"), x = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, ps = [];
  const ORB = (function(){
    const R = 18, o = document.createElement("canvas"); o.width = o.height = R * 2;
    const g = o.getContext("2d"), gr = g.createRadialGradient(R, R, 0, R, R, R);
    [[0,"176,203,219",1],[.22,"123,173,198",1],[.44,"53,132,171",1],[.56,"27,106,146",1],[.67,"40,90,120",.5],[.78,"30,90,125",.28],[.89,"30,90,125",.08],[1,"30,90,125",0]]
      .forEach(s => gr.addColorStop(s[0], "rgba(" + s[1] + "," + s[2] + ")"));
    g.fillStyle = gr; g.fillRect(0, 0, R * 2, R * 2); return o;
  })();
  function size(){
    w = c.width = innerWidth; h = c.height = innerHeight;
    ps = Array.from({length: Math.min(36, Math.floor(w / 30))}, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 10 + 8,
      d: Math.random() * 6.283, vx: 0, vy: Math.random() * 1.1 + .6, a: Math.random() * .4 + .6
    }));
    if (still) draw();
  }
  function draw(){
    x.clearRect(0, 0, w, h);
    for (const p of ps){
      x.globalAlpha = p.a; const s = p.r * 2; x.drawImage(ORB, p.x - s / 2, p.y - s / 2, s, s);
      
      
    }
  }
  function tick(){
    for (const p of ps){
      p.d += .015; p.x += Math.sin(p.d) * .5; p.y += p.vy;
      if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10;
      if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10;
    }
    draw(); requestAnimationFrame(tick);
  }
  addEventListener("resize", size); size();
  if (!still) tick();
})();
